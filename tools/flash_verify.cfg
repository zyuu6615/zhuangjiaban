# 生产版最终验证：时钟 + 启动 + 灯带缓冲区 + 开关输入
# 用法：openocd -f openocd.cfg -f tools/diag_final.cfg
adapter speed 500

proc rd8 {addr} {
    mem2array _v 8 $addr 1
    return [expr {$_v(0)}]
}
proc rd16 {addr} {
    mem2array _v 16 $addr 1
    return [expr {$_v(0)}]
}
proc rd32 {addr} {
    mem2array _w 32 $addr 1
    return [expr {$_w(0)}]
}
proc dump16 {addr n} {
    set out ""
    for {set i 0} {$i < $n} {incr i} {
        append out "[rd16 [expr {$addr + $i*2}]] "
    }
    return $out
}

init
reset halt
sleep 200
program "D:/RoboMaster/Touch_led/Touch_led/build/Debug/Touch_led.elf" verify

# 跑 3 秒：足够过完 300ms HSE 探测 + 200ms 上电指示，进入主循环
reset run
for {set i 0} {$i < 3} {incr i} {
    sleep 1000
}
halt

set cr   [rd32 0x40021000]
set cfgr [rd32 0x40021004]
set sw   [expr {($cfgr >> 2) & 0x3}]
set pllsrc [expr {($cfgr >> 16) & 0x1}]
set pllmul [expr {(($cfgr >> 18) & 0xF) + 2}]
set idr  [rd32 0x40010C08]
set arr  [rd16 0x4000002C]

puts ""
puts "########## 生产版验证结果 ##########"
puts ""
puts "--- 时钟 ---"
puts "  RCC_CR   = [format 0x%08X $cr]  HSION=[expr {($cr >> 0) & 1}] HSIRDY=[expr {($cr >> 1) & 1}] HSEON=[expr {($cr >> 16) & 1}] HSERDY=[expr {($cr >> 17) & 1}] PLLON=[expr {($cr >> 24) & 1}]"
puts "  RCC_CFGR = [format 0x%08X $cfgr]  SWS=${sw} (2=PLL)  PLLSRC=${pllsrc} (0=HSI/2)  PLLMUL=x${pllmul}"
if {$pllsrc == 0 && $pllmul == 16} {
    puts "  => SYSCLK = 4MHz x 16 = 64MHz   TIM2 = 64MHz   ARR = [expr {$arr + 1}]（应=80）"
}
if {$pllsrc == 1 && $pllmul == 9} {
    puts "  => SYSCLK = HSE 8MHz x 9 = 72MHz   TIM2 = 72MHz   ARR = [expr {$arr + 1}]（应=90）"
}
puts "  TIM2_ARR = [expr {$arr + 1}] 个计数/位 (目标 80 @64MHz = 1.25us)"
puts ""
puts "--- 启动流程 ---"
puts "  diag_stage    = [rd8 0x20000500]   (12=已进主循环)"
puts "  diag_clock_ok = [rd8 0x20000501]   (1=72M HSE / 3=64M HSI / 2=48M HSI)"
puts "  diag_can_ok   = [rd8 0x20000019]   (0=OK / 1=CAN异常 / 255=未调用)"
puts "  diag_i2c_ok   = [rd8 0x20000018]   (0=OK)"
puts ""
puts "--- 灯带 ---"
puts "  GPIOA_CRL  = [format 0x%08X [rd32 0x40010800]]   (PA0=0xB 复用推挽)"
puts "  TIM2_CR1   = [format 0x%08X [rd32 0x40000000]]   (bit0 CEN=1 定时器在跑)"
puts "  缓冲区前 16 值（应只含 0码27 / 1码54）:"
puts "    [dump16 0x200001A0 16]"
puts "  缓冲区末 4 值（复位段，应全 0）:"
puts "    [dump16 [expr {0x200001A0 + 432*2 - 8}] 4]"
puts ""
puts "--- 本地开关输入 ---"
puts "  GPIOB_IDR = [format 0x%08X $idr]"
puts "    PB8(红开关)=[expr {($idr >> 8) & 1}]   PB9(蓝开关)=[expr {($idr >> 9) & 1}]"
if {((($idr >> 8) & 1) == 0) && ((($idr >> 9) & 1) == 0)} {
    puts "    两个开关都低 -> 代码逻辑判为\"熄灭档\"，灯带平时不亮（上电指示除外）"
} else {
    puts "    有开关为高 -> 应显示对应队伍色"
}
puts ""
puts "--- 结论 ---"
if {[rd8 0x20000500] == 12} {
    puts "  ✅ 启动流程完整走通，已进主循环"
} else {
    puts "  ❌ 未进主循环，diag_stage=[rd8 0x20000500]"
}
if {$arr == 79} {
    puts "  ✅ TIM2 时序正确（64MHz, ARR=79, 位周期 1.25us）"
} elseif {$arr == 89} {
    puts "  ✅ TIM2 时序正确（72MHz, ARR=89, 位周期 1.25us）"
} else {
    puts "  ⚠ TIM2 ARR=$arr 与预期不符"
}

shutdown
